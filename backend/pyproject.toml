# Tool settings for the IntelliDoc AI backend (dependencies stay in requirements.txt).

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, security (bandit) checks
select = ["E", "F", "W", "B", "S"]
ignore = [
    "B008",  # FastAPI's Depends(...) in default arguments is the intended pattern
    "E501",  # long lines are allowed (formatter not enforced)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and throwaway test passwords
"scripts/migrate_sqlite_to_postgres.py" = ["S608"]  # table names come from app metadata, not input

[tool.coverage.run]
source = ["app"]
