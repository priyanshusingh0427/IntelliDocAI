# nginx config for the IntelliDoc AI frontend container.
upstream intellidoc_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Uploads are limited to 10 MB by the backend; allow a little multipart overhead.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: answers can take a while on the first question (models load, LLM generates).
    location /api/ {
        proxy_pass http://intellidoc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Interactive API docs (Swagger UI loads its own scripts, so no strict CSP here).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://intellidoc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS have content hashes in their names: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths serve index.html (never cached, so new builds load).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
