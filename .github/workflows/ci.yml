# Continuous integration for IntelliDoc AI: runs on every push and pull request.
#   backend   - lint + tests on SQLite and PostgreSQL
#   frontend  - unit tests + production build
#   e2e       - real browser against the real backend and search models
#   docker    - builds both images, starts the stack with docker compose and smoke-tests it
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: intellidoc
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: intellidoc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intellidoc -d intellidoc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt transformers==4.46.3 tokenizers==0.20.3
      - name: Lint
        run: ruff check app tests scripts
      - name: Tests (SQLite) with coverage
        run: pytest -q --cov --cov-report=term:skip-covered
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://intellidoc:ci-password@localhost:5432/intellidoc_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text-summary
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies (CPU-only PyTorch)
        working-directory: backend
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt transformers==4.46.3 tokenizers==0.20.3
      - name: Cache search models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: hf-models-minilm-l6-v2-ms-marco-l6-v1
      - name: Download search models
        working-directory: backend
        run: python scripts/download_models.py
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e-report
            frontend/e2e-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env with throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(16))')"
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')"
            echo "LLM_PROVIDER=extractive"
            echo "PUBLIC_PORT=8080"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start database, backend and frontend (no Ollama in CI)
        run: docker compose up -d postgres backend frontend
      - name: Smoke test through nginx
        run: |
          pip install httpx==0.28.1
          python backend/scripts/smoke_test.py http://localhost:8080 --wait 240
      - name: Image sizes
        if: always()
        run: docker image ls --filter "reference=intellidoc*"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
